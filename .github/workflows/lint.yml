name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository

      - name: Analyze scripts
        shell: pwsh
        run: |
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0
          $Results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $Results | Format-List -Property RuleName, Severity, ScriptName, Line, Column, Message
          if ($Results.Count -gt 0) { exit 1 }
